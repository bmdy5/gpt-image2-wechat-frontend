<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Top App Bar Specifics */
        .top-app-bar {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }

        /* Bottom Nav Bar Specifics */
        .bottom-nav-bar {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-top: 0.5px solid rgba(0, 0, 0, 0.05);
        }

        /* Buttons */
        .btn-primary {
            background-color: theme('colors.primary');
            color: theme('colors.on-primary');
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-color 0.3s ease;
        }
        .btn-primary:active {
            transform: scale(0.92);
            box-shadow: 0 4px 12px rgba(161, 58, 0, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 20px rgba(161, 58, 0, 0.3);
        }

        /* Textarea Focus State */
        .textarea-input {
            transition: color 0.3s ease;
        }
        .textarea-input:focus {
            outline: none;
            border: none;
            box-shadow: none;
        }

        /* Particle Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Modal */
        .modal-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        /* AI Enhancing Border Animation */
        @keyframes enhanceGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .ai-enhancing-border {
            position: relative;
            z-index: 1;
        }
        .ai-enhancing-border::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(90deg, #a13a00, #ffb598, #ffdbce, #a13a00);
            background-size: 300% 300%;
            z-index: -1;
            animation: enhanceGradient 3s ease infinite;
            border-radius: 18px;
            opacity: 0.3;
        }

        /* Loading Spinner */
        .spinner {
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .is-generating .spinner { display: inline-block; }
        .is-generating .btn-text-default { display: none; }
        .is-generating .btn-text-loading { display: inline; }
        .btn-text-loading { display: none; }

            padding-top: 76px;
            padding-bottom: calc(140px + env(safe-area-bottom));
            min-height: 100vh;

            z-index: 1;

<script>
        // Particle Background System (Eastern Minimalist Upgrade)
        const particleCanvas = document.getElementById('particle-canvas');
        const pCtx = particleCanvas.getContext('2d');
        let bgParticles = [];
        let pAnimId;
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function resizeParticleCanvas() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resizeParticleCanvas);

        class BgParticle {
            constructor() {
                this.x = Math.random() * particleCanvas.width;
                this.y = Math.random() * particleCanvas.height;
                this.initParams();
            }
            initParams() {
                this.size = Math.random() * 1.5 + 0.5;
                this.angle = Math.random() * Math.PI * 2;
                this.life = Math.random() * 1000;
                
                if (state.currentMode === 'basic') {
                    // Stardust: sparse, slow, vertical drift
                    this.speed = Math.random() * 0.15 + 0.05;
                    this.alpha = Math.random() * 0.2 + 0.05;
                } else if (state.currentMode === 'advanced') {
                    // Flowing Silk: wave pattern, gentle
                    this.speed = Math.random() * 0.3 + 0.1;
                    this.alpha = Math.random() * 0.3 + 0.05;
                    this.wavePhase = Math.random() * Math.PI * 2;
                    this.waveSpeed = Math.random() * 0.015 + 0.005;
                    this.waveAmp = Math.random() * 1.2 + 0.3;
                } else {
                    // Ethereal Nebula: curved intelligent paths, glowing
                    this.speed = Math.random() * 0.5 + 0.15;
                    this.alpha = Math.random() * 0.4 + 0.1;
                    this.size = Math.random() * 2 + 0.5;
                }
            }
            reset() {
                this.initParams();
                this.y = particleCanvas.height + Math.random() * 100;
                this.x = Math.random() * particleCanvas.width;
                
                if(state.currentMode === 'flagship') {
                    if(Math.random() > 0.5) {
                        this.x = Math.random() > 0.5 ? -20 : particleCanvas.width + 20;
                        this.y = Math.random() * particleCanvas.height;
                    }
                }
            }
            update() {
                this.life++;
                
                if (state.currentMode === 'basic') {
                    this.y -= this.speed;
                    this.x += Math.sin(this.life * 0.005) * 0.1;
                } else if (state.currentMode === 'advanced') {
                    this.y -= this.speed;
                    this.x += Math.sin(this.wavePhase + this.life * this.waveSpeed) * this.waveAmp;
                } else { // flagship
                    this.angle += (Math.random() - 0.5) * 0.03;
                    const vx = Math.cos(this.angle) * this.speed;
                    const vy = Math.sin(this.angle) * this.speed - this.speed * 0.4; // general upward drift
                    this.x += vx;
                    this.y += vy;
                    
                    // Gentle avoidance
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        const force = (150 - distance) / 150;
                        this.x -= (dx / distance) * force * 0.5;
                        this.y -= (dy / distance) * force * 0.5;
                    }
                }

                if (this.x < -50 || this.x > particleCanvas.width + 50 || this.y < -50 || this.y > particleCanvas.height + 50) {
                    this.reset();
                }
            }
            draw() {
                pCtx.beginPath();
                pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (state.currentMode === 'flagship') {
                    pCtx.shadowBlur = 12;
                    pCtx.shadowColor = `rgba(161, 58, 0, ${this.alpha * 0.8})`; // Theme primary glow
                    pCtx.fillStyle = `rgba(255, 181, 152, ${this.alpha})`; // Light inverse-primary
                } else if (state.currentMode === 'advanced') {
                    pCtx.shadowBlur = 4;
                    pCtx.shadowColor = `rgba(200, 200, 200, ${this.alpha * 0.5})`;
                    pCtx.fillStyle = `rgba(180, 180, 180, ${this.alpha})`;
                } else {
                    pCtx.shadowBlur = 0;
                    pCtx.fillStyle = `rgba(160, 160, 160, ${this.alpha})`;
                }
                
                pCtx.fill();
                pCtx.shadowBlur = 0;
            }
        }

        function initParticles() {
            bgParticles = [];
            let count = 40; // basic
            if (state.currentMode === 'advanced') count = 60;
            if (state.currentMode === 'flagship') count = 80;
            for (let i = 0; i < count; i++) {
                bgParticles.push(new BgParticle());
            }
        }

        function animateBgParticles() {
            if(state.currentMode === 'advanced' || state.currentMode === 'flagship') {
                // Subtle trailing effect
                pCtx.fillStyle = 'rgba(255, 255, 255, 0.15)'; 
                pCtx.fillRect(0, 0, particleCanvas.width, particleCanvas.height);
            } else {
                pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            }

            bgParticles.forEach(p => {
                p.update();
                p.draw();
            });
            pAnimId = requestAnimationFrame(animateBgParticles);
        }


        // FX Canvas Setup (kept for generate explosion)
        const fxCanvas = document.getElementById('fx-canvas');
        const ctx = fxCanvas.getContext('2d');
        let fxParticles = [];
        let fxAnimId;

        function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFxCanvas);
        resizeFxCanvas();

        class FxParticle {
            constructor(x, y, mode) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (mode === 'flagship' ? 12 : 8) + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.015;
                this.size = Math.random() * (mode === 'flagship' ? 6 : 4) + 1.5;
                
                let hue = Math.random() * 30 + 10; // Orange hues
                this.color = `hsla(${hue}, 100%, 65%, `;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96; 
                this.vy *= 0.96;
                this.life -= this.decay;
                this.size *= 0.98;
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.life + ')';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color + '1)';
                ctx.fill();
                ctx.shadowBlur = 0; 
            }
        }

        function triggerTechExplosion(x, y, mode) {
            const count = mode === 'flagship' ? 100 : (mode === 'advanced' ? 60 : 30);
            for (let i = 0; i < count; i++) {
                fxParticles.push(new FxParticle(x, y, mode));
            }
            if (!fxAnimId) animateFx();
        }

        function animateFx() {
            ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = fxParticles.length - 1; i >= 0; i--) {
                let p = fxParticles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0 || p.size <= 0.1) {
                    fxParticles.splice(i, 1);
                }
            }
            if (fxParticles.length > 0) {
                fxAnimId = requestAnimationFrame(animateFx);
            } else {
                fxAnimId = null;
            }
        }

        // State Management
        const state = {
            inspirationPoints: 80,
            currentMode: 'basic', 
            isEnhancing: false,
            isGenerating: false,
            promptText: ''
        };

        // DOM Elements
        const pointsDisplay = document.getElementById('points-display');
        const enhanceBtn = document.getElementById('enhance-btn');
        const textareaWrapper = document.getElementById('textarea-wrapper');
        const promptInput = document.getElementById('prompt-input');
        const generateBtn = document.getElementById('generate-btn');
        const charCount = document.getElementById('char-count');
        const styleModal = document.getElementById('style-modal');
        const modeDropdown = document.getElementById('mode-dropdown');
        const currentModeLabel = document.getElementById('current-mode-label');
        const modeOptions = document.querySelectorAll('.mode-option');

        // Initialize Background
        resizeParticleCanvas();
        animateBgParticles();

        // Event Listeners
        promptInput.addEventListener('input', (e) => {
            state.promptText = e.target.value;
            charCount.textContent = state.promptText.length;
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!modeDropdown.contains(e.target)) {
                modeDropdown.classList.remove('active');
            }
        });

        // Actions
        function toggleModeDropdown(e) {
            e.stopPropagation();
            modeDropdown.classList.toggle('active');
        }

        function setMode(mode, label, e) {
            if(e) {
                e.stopPropagation();
            }
            if(state.isGenerating) return;
            state.currentMode = mode;
            currentModeLabel.textContent = label;
            modeDropdown.classList.remove('active');

            // Update Selected Styling
            modeOptions.forEach(opt => opt.classList.remove('selected'));
            if(e) e.target.classList.add('selected');

            // Re-init particles for new mode with a smooth fade in future versions
            initParticles();
        }

        function toggleEnhance() {
            if(state.isGenerating) return;
            state.isEnhancing = !state.isEnhancing;
            if(state.isEnhancing) {
                textareaWrapper.classList.add('ai-enhancing-border');
                enhanceBtn.classList.add('text-primary');
                enhanceBtn.classList.remove('text-on-surface-variant');
            } else {
                textareaWrapper.classList.remove('ai-enhancing-border');
                enhanceBtn.classList.remove('text-primary');
                enhanceBtn.classList.add('text-on-surface-variant');
            }
        }

        function fillPrompt(text) {
            if(state.isGenerating) return;
            promptInput.value = text;
            state.promptText = text;
            charCount.textContent = text.length;
        }

        function openStyleModal() {
            styleModal.classList.add('active');
        }

        function closeStyleModal(e) {
            if(e && e.target === styleModal) {
                styleModal.classList.remove('active');
            } else if (!e) {
                styleModal.classList.remove('active');
            }
        }

        function selectStyle(styleName) {
            const currentText = promptInput.value;
            const newText = currentText ? `${currentText}，${styleName}风格` : `${styleName}风格`;
            fillPrompt(newText);
            closeStyleModal();
        }

        function startGeneration(e) {
            if(state.isGenerating || state.promptText.trim() === '') {
                if(state.promptText.trim() === '') {
                    promptInput.focus();
                }
                return;
            }
            if(state.inspirationPoints < 1) {
                alert("灵感值不足");
                return;
            }

            // Trigger Particle Effect
            const rect = generateBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            triggerTechExplosion(centerX, centerY, state.currentMode);

            // Update State
            state.isGenerating = true;
            generateBtn.classList.add('is-generating');
            generateBtn.classList.remove('active:scale-95');
            promptInput.disabled = true;
            
            // Deduct Points
            const cost = state.currentMode === 'flagship' ? 5 : (state.currentMode === 'advanced' ? 2 : 1);
            if(state.inspirationPoints < cost) {
                 alert("灵感值不足");
                 state.isGenerating = false;
                 generateBtn.classList.remove('is-generating');
                 generateBtn.classList.add('active:scale-95');
                 promptInput.disabled = false;
                 return;
            }
            state.inspirationPoints -= cost;
            pointsDisplay.textContent = state.inspirationPoints;

            // Simulate API Call
            setTimeout(() => {
                state.isGenerating = false;
                generateBtn.classList.remove('is-generating');
                generateBtn.classList.add('active:scale-95');
                promptInput.disabled = false;
                promptInput.value = '';
                state.promptText = '';
                charCount.textContent = '0';
                
                // Show Success
                const originalBg = generateBtn.style.background;
                const originalBgColor = generateBtn.style.backgroundColor;
                generateBtn.style.background = 'none';
                generateBtn.style.backgroundColor = '#4caf50'; 
                generateBtn.querySelector('.btn-text-default').innerHTML = '完成';
                
                setTimeout(() => {
                    generateBtn.style.background = originalBg;
                    generateBtn.style.backgroundColor = originalBgColor;
                    generateBtn.querySelector('.btn-text-default').innerHTML = '生成';
                }, 2000);

            }, 3000);
        }
    </script>
</body></html>
